        - generic [ref=e343]:
          - heading "Assurance Vie — Transmission" [level=2] [ref=e344]
          - list [ref=e345]:
            - listitem [ref=e346]:
              - generic [ref=e348]: "Article 757 B (décès avant 70 ans) : 152 500 € exonérés par bénéficiaire désigné. Au-delà : 20 % jusqu'à 852 500 €, puis 31,25 %."
            - listitem [ref=e349]:
              - generic [ref=e351]: "Article 990 I (décès après 70 ans) : abattement global de 30 500 € sur les primes versées après 70 ans. Les gains sont exonérés."
            - listitem [ref=e352]:
              - generic [ref=e354]: "Conjoint / Pacsé : exonération totale de droits de succession, quels que soient l'âge du défunt et le montant transmis."
            - listitem [ref=e355]:
              - generic [ref=e357]: "Clause bénéficiaire démembrée : conjoint usufruitier (exonéré) + enfants nus-propriétaires (abattement de 152 500 € × nombre d'enfants)."
            - listitem [ref=e358]:
              - generic [ref=e360]: "Différence capitaux décès vs droits de succession : les capitaux décès sont exonérés d'impôt sur le revenu mais soumis aux droits de succession classiques."
        - generic [ref=e361]:
          - heading "PER — Transmission" [level=2] [ref=e362]
          - list [ref=e363]:
            - listitem [ref=e364]:
              - generic [ref=e366]: "Pas d'abattement spécifique PER : le capital décès est transmis au(x) bénéficiaire(s) désigné(s) selon les droits de succession classiques."
            - listitem [ref=e367]:
              - generic [ref=e369]: "Conjoint / Pacsé : exonération totale (abattement illimité en ligne directe)."
            - listitem [ref=e370]:
              - generic [ref=e372]: "Enfants : abattement de 100 000 € par enfant, puis barème progressif de 5 % à 45 %."
            - listitem [ref=e373]:
              - generic [ref=e375]: "Valeur de rachat vs valeur de transfert : la valeur de transfert (capital + gains) est transmise, pas la valeur de rachat."
            - listitem [ref=e376]:
              - generic [ref=e378]: "Rente non transmissible : la rente PER n'est pas transmise aux héritiers, sauf option de réversion (payante et limitée)."
        - generic [ref=e379]:
          - heading "Immobilier — Transmission" [level=2] [ref=e380]
          - list [ref=e381]:
            - listitem [ref=e382]:
              - generic [ref=e384]: "Droits de succession barème ligne directe : après abattement de 100 000 € par enfant, barème progressif de 5 % à 45 %."
            - listitem [ref=e385]:
              - generic [ref=e387]: "Conjoint / Pacsé : exonération totale de droits de succession sur la résidence principale (loi TEPA) et abattement illimité."
            - listitem [ref=e388]:
              - generic [ref=e390]: "Plus-values latentes : exonération au décès (Article 150-0 A du CGI). L'héritier récupère le bien à sa valeur vénale sans taxation des plus-values."
            - listitem [ref=e391]:
              - generic [ref=e393]: "Taxation des plus-values en cas de donation : le donataire subit un rapport fiscal si le bien est revendu (taxation sur la plus-value depuis l'acquisition par le donateur)."
            - listitem [ref=e394]:
              - generic [ref=e396]: "Barème détaillé : 5 % jusqu'à 8 072 €, 10 % jusqu'à 12 109 €, 15 % jusqu'à 15 932 €, 20 % jusqu'à 552 324 €, 30 % jusqu'à 902 838 €, 40 % jusqu'à 1 805 677 €, 45 % au-delà."
        - generic [ref=e397]:
          - heading "Dons directs et Donations" [level=2] [ref=e398]
          - list [ref=e399]:
            - listitem [ref=e400]:
              - generic [ref=e402]: "Abattement enfant : 100 000 € tous les 15 ans par parent et par enfant (cumulable : 200 000 € si don des deux parents)."
            - listitem [ref=e403]:
              - generic [ref=e405]: "Abattement conjoint : 80 724 € tous les 15 ans. Abattement petit-enfant : 31 865 € tous les 15 ans."
            - listitem [ref=e406]:
              - generic [ref=e408]: "Abattement frère / sœur : 15 932 €. Abattement neveu / nièce : 7 967 €. Aucun abattement pour cousins et non-parents."
            - listitem [ref=e409]:
              - generic [ref=e411]: "Don familial de 31 865 € (loi Colbert) : exonération totale sous conditions (parenté directe, usage personnel du donataire)."
            - listitem [ref=e412]:
              - generic [ref=e414]: "Don Sarkozy / transmission d'entreprise : exonération de 75 % des titres via le pacte Dutreil (engagement collectif 2 ans + individuel 4 ans)."
            - listitem [ref=e415]:
              - generic [ref=e417]: "Règle du rapport civil et fiscal : les donations doivent être rapportées à la succession pour le calcul des droits."
            - listitem [ref=e418]:
              - generic [ref=e420]: "Réunion des donations (loi TEPA) : toutes les donations faites moins de 15 ans avant le décès sont réunies à la succession."
        - generic [ref=e421]:
          - heading "Entreprise et Titres — Transmission" [level=2] [ref=e422]
          - list [ref=e423]:
            - listitem [ref=e424]:
              - generic [ref=e426]: "Pacte Dutreil : exonération de 75 % de la valeur des titres de société (SCI, SARL, SAS, SA) sous conditions d'engagement de conservation."
            - listitem [ref=e427]:
              - generic [ref=e429]: "Conditions : engagement collectif de 2 ans (associés détenant 20 % des droits) + engagement individuel de 4 ans par le donataire / héritier."
            - listitem [ref=e430]:
              - generic [ref=e432]: "Abattement classique cumulable : 100 000 € (enfant) + Dutreil 75 % = transmission quasi gratuite pour un enfant."
            - listitem [ref=e433]:
              - generic [ref=e435]: "Réserves de capitalisation : exonération des plus-values en cas de cession si les réserves sont réinvesties dans l'entreprise."
            - listitem [ref=e436]:
              - generic [ref=e438]: "Succession d'entreprise individuelle : le conjoint peut hériter de l'entreprise avec exonération totale sous conditions (loi TEPA)."
        - generic [ref=e439]:
          - heading "Usufruit et Démembrement" [level=2] [ref=e440]
          - list [ref=e441]:
            - listitem [ref=e442]:
              - generic [ref=e444]: "Barème fiscal de l'usufruit (Article 669 CGI) selon l'âge de l'usufruitier : < 21 ans (90 % / 10 %), 21-30 ans (80 % / 20 %), 31-40 ans (70 % / 30 %), 41-50 ans (60 % / 40 %), 51-60 ans (50 % / 50 %), 61-70 ans (40 % / 60 %), 71-80 ans (30 % / 70 %), 81-90 ans (20 % / 80 %), 91+ ans (10 % / 90 %)."
            - listitem [ref=e445]:
              - generic [ref=e447]: "Donation avec réserve d'usufruit : pas de droit de donation sur la part d'usufruit (seule la nue-propriété est taxée)."
            - listitem [ref=e448]:
              - generic [ref=e450]: "Quasi-usufruit : l'usufruitier peut consommer le capital (ex : rente viagère). La valeur fiscale est différente de l'usufruit classique."
            - listitem [ref=e451]:
              - generic [ref=e453]: "Clause de retour : si l'usufruitier décède avant le nu-propriétaire, la nue-propriété revient à la succession du défunt."
            - listitem [ref=e454]:
              - generic [ref=e456]: "Démembrement croisé entre époux : chaque époux donne la nue-propriété de ses biens à l'autre en usufruit, optimisant les abattements."
        - generic [ref=e457]:
          - heading "Optimisation successorale" [level=2] [ref=e458]
          - list [ref=e459]:
            - listitem [ref=e460]:
              - generic [ref=e462]: "Donation-partage : fige la valeur des biens au moment du don, évite les conflits entre héritiers et optimise les abattements."
            - listitem [ref=e463]:
              - generic [ref=e465]: "Démembrement croisé entre époux : chaque conjoint transmet la nue-propriété à l'autre en usufruit, doublant les abattements."
            - listitem [ref=e466]:
              - generic [ref=e468]: "Recours à l'AV pour multiplier les abattements : 152 500 € × nombre de bénéficiaires désignés, renouvelable tous les 15 ans."
            - listitem [ref=e469]:
              - generic [ref=e471]: "Pacte Dutreil pour transmission d'entreprise : 75 % d'exonération cumulable avec l'abattement de 100 000 € par enfant."
            - listitem [ref=e472]:
              - generic [ref=e474]: "SCI pour démembrement immobilier : transmission de la nue-propriété aux enfants via une SCI, l'usufruit restant au parent."
            - listitem [ref=e475]:
              - generic [ref=e477]: "Assurance décès vs AV : l'assurance décès couvre un risque temporaire ; l'AV couvre un risque permanent avec abattement successoral."
            - listitem [ref=e478]:
              - generic [ref=e480]: "Calendrier des donations : renouveler les abattements tous les 15 ans (100 000 € enfant, 80 724 € conjoint, 31 865 € petit-enfant)."
            - listitem [ref=e481]:
              - generic [ref=e483]: "Abattement renouvelable : chaque parent peut donner 100 000 € à chaque enfant tous les 15 ans, soit 400 000 € par couple et par enfant sur une vie."
