        - generic [ref=f1e343]:
          - heading "Assurance Vie — Transmission" [level=2] [ref=f1e344]
          - list [ref=f1e345]:
            - listitem [ref=f1e346]:
              - generic [ref=f1e348]: "Article 757 B (décès avant 70 ans) : 152 500 € exonérés par bénéficiaire désigné. Au-delà : 20 % jusqu'à 852 500 €, puis 31,25 %."
            - listitem [ref=f1e349]:
              - generic [ref=f1e351]: "Article 990 I (décès après 70 ans) : abattement global de 30 500 € sur les primes versées après 70 ans. Les gains sont exonérés."
            - listitem [ref=f1e352]:
              - generic [ref=f1e354]: "Conjoint / Pacsé : exonération totale de droits de succession, quels que soient l'âge du défunt et le montant transmis."
            - listitem [ref=f1e355]:
              - generic [ref=f1e357]: "Clause bénéficiaire démembrée : conjoint usufruitier (exonéré) + enfants nus-propriétaires (abattement de 152 500 € × nombre d'enfants)."
            - listitem [ref=f1e358]:
              - generic [ref=f1e360]: "Différence capitaux décès vs droits de succession : les capitaux décès sont exonérés d'impôt sur le revenu mais soumis aux droits de succession classiques."
        - generic [ref=f1e361]:
          - heading "PER — Transmission" [level=2] [ref=f1e362]
          - list [ref=f1e363]:
            - listitem [ref=f1e364]:
              - generic [ref=f1e366]: "Pas d'abattement spécifique PER : le capital décès est transmis au(x) bénéficiaire(s) désigné(s) selon les droits de succession classiques."
            - listitem [ref=f1e367]:
              - generic [ref=f1e369]: "Conjoint / Pacsé : exonération totale (abattement illimité en ligne directe)."
            - listitem [ref=f1e370]:
              - generic [ref=f1e372]: "Enfants : abattement de 100 000 € par enfant, puis barème progressif de 5 % à 45 %."
            - listitem [ref=f1e373]:
              - generic [ref=f1e375]: "Valeur de rachat vs valeur de transfert : la valeur de transfert (capital + gains) est transmise, pas la valeur de rachat."
            - listitem [ref=f1e376]:
              - generic [ref=f1e378]: "Rente non transmissible : la rente PER n'est pas transmise aux héritiers, sauf option de réversion (payante et limitée)."
        - generic [ref=f1e379]:
          - heading "Immobilier — Transmission" [level=2] [ref=f1e380]
          - list [ref=f1e381]:
            - listitem [ref=f1e382]:
              - generic [ref=f1e384]: "Droits de succession barème ligne directe : après abattement de 100 000 € par enfant, barème progressif de 5 % à 45 %."
            - listitem [ref=f1e385]:
              - generic [ref=f1e387]: "Conjoint / Pacsé : exonération totale de droits de succession sur la résidence principale (loi TEPA) et abattement illimité."
            - listitem [ref=f1e388]:
              - generic [ref=f1e390]: "Plus-values latentes : exonération au décès (Article 150-0 A du CGI). L'héritier récupère le bien à sa valeur vénale sans taxation des plus-values."
            - listitem [ref=f1e391]:
              - generic [ref=f1e393]: "Taxation des plus-values en cas de donation : le donataire subit un rapport fiscal si le bien est revendu (taxation sur la plus-value depuis l'acquisition par le donateur)."
            - listitem [ref=f1e394]:
              - generic [ref=f1e396]: "Barème détaillé : 5 % jusqu'à 8 072 €, 10 % jusqu'à 12 109 €, 15 % jusqu'à 15 932 €, 20 % jusqu'à 552 324 €, 30 % jusqu'à 902 838 €, 40 % jusqu'à 1 805 677 €, 45 % au-delà."
        - generic [ref=f1e397]:
          - heading "Dons directs et Donations" [level=2] [ref=f1e398]
          - list [ref=f1e399]:
            - listitem [ref=f1e400]:
              - generic [ref=f1e402]: "Abattement enfant : 100 000 € tous les 15 ans par parent et par enfant (cumulable : 200 000 € si don des deux parents)."
            - listitem [ref=f1e403]:
              - generic [ref=f1e405]: "Abattement conjoint : 80 724 € tous les 15 ans. Abattement petit-enfant : 31 865 € tous les 15 ans."
            - listitem [ref=f1e406]:
              - generic [ref=f1e408]: "Abattement frère / sœur : 15 932 €. Abattement neveu / nièce : 7 967 €. Aucun abattement pour cousins et non-parents."
            - listitem [ref=f1e409]:
              - generic [ref=f1e411]: "Don familial de 31 865 € (loi Colbert) : exonération totale sous conditions (parenté directe, usage personnel du donataire)."
            - listitem [ref=f1e412]:
              - generic [ref=f1e414]: "Don Sarkozy / transmission d'entreprise : exonération de 75 % des titres via le pacte Dutreil (engagement collectif 2 ans + individuel 4 ans)."
            - listitem [ref=f1e415]:
              - generic [ref=f1e417]: "Règle du rapport civil et fiscal : les donations doivent être rapportées à la succession pour le calcul des droits."
            - listitem [ref=f1e418]:
              - generic [ref=f1e420]: "Réunion des donations (loi TEPA) : toutes les donations faites moins de 15 ans avant le décès sont réunies à la succession."
        - generic [ref=f1e421]:
          - heading "Entreprise et Titres — Transmission" [level=2] [ref=f1e422]
          - list [ref=f1e423]:
            - listitem [ref=f1e424]:
              - generic [ref=f1e426]: "Pacte Dutreil : exonération de 75 % de la valeur des titres de société (SCI, SARL, SAS, SA) sous conditions d'engagement de conservation."
            - listitem [ref=f1e427]:
              - generic [ref=f1e429]: "Conditions : engagement collectif de 2 ans (associés détenant 20 % des droits) + engagement individuel de 4 ans par le donataire / héritier."
            - listitem [ref=f1e430]:
              - generic [ref=f1e432]: "Abattement classique cumulable : 100 000 € (enfant) + Dutreil 75 % = transmission quasi gratuite pour un enfant."
            - listitem [ref=f1e433]:
              - generic [ref=f1e435]: "Réserves de capitalisation : exonération des plus-values en cas de cession si les réserves sont réinvesties dans l'entreprise."
            - listitem [ref=f1e436]:
              - generic [ref=f1e438]: "Succession d'entreprise individuelle : le conjoint peut hériter de l'entreprise avec exonération totale sous conditions (loi TEPA)."
        - generic [ref=f1e439]:
          - heading "Usufruit et Démembrement" [level=2] [ref=f1e440]
          - list [ref=f1e441]:
            - listitem [ref=f1e442]:
              - generic [ref=f1e444]: "Barème fiscal de l'usufruit (Article 669 CGI) selon l'âge de l'usufruitier : < 21 ans (90 % / 10 %), 21-30 ans (80 % / 20 %), 31-40 ans (70 % / 30 %), 41-50 ans (60 % / 40 %), 51-60 ans (50 % / 50 %), 61-70 ans (40 % / 60 %), 71-80 ans (30 % / 70 %), 81-90 ans (20 % / 80 %), 91+ ans (10 % / 90 %)."
            - listitem [ref=f1e445]:
              - generic [ref=f1e447]: "Donation avec réserve d'usufruit : pas de droit de donation sur la part d'usufruit (seule la nue-propriété est taxée)."
            - listitem [ref=f1e448]:
